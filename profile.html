<!DOCTYPE html>
<html lang="ru" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Профиль — DevHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --radius-sm:10px; --radius-md:16px; --radius-lg:24px;
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 20px 40px -20px rgba(0,0,0,.55);
  --dur:.3s;
}
html[data-theme="night"]{ --bg:#0A0B10; --bg2:#111319; --surface:#15171F; --surface2:#1B1E28; --border:#262A36; --text:#F2F3F9; --muted:#9498B2; --faint:#666B84; --primary:#8B7CFF; --primary-d:#7566F0; --primary-soft:#241F3D; --on-primary:#0A0B10; --star:#FFC65C; --a:#453BAA; --b:#8B7CFF; }
html[data-theme="day"]{ --bg:#EDF0FA; --bg2:#F7F8FD; --surface:#FFFFFF; --surface2:#FBFBFF; --border:#E1E4F1; --text:#181B29; --muted:#666C85; --faint:#9498AC; --primary:#6D5DF6; --primary-d:#5747E4; --primary-soft:#ECE9FE; --on-primary:#fff; --star:#F5A623; --a:#6D5DF6; --b:#B18CFF; }
html[data-theme="apple"]{ --bg:#0E1A11; --bg2:#132218; --surface:#16261B; --surface2:#1B2D20; --border:#243A2B; --text:#EAF7EE; --muted:#8FB59B; --faint:#5C7A66; --primary:#3FD873; --primary-d:#2FB55E; --primary-soft:#193A24; --on-primary:#06170B; --star:#EFA93B; --a:#3FD873; --b:#8CE6A8; }
html[data-theme="warm"]{ --bg:#1C120A; --bg2:#241708; --surface:#28190C; --surface2:#301E0F; --border:#3C260F; --text:#FCE9D6; --muted:#C29868; --faint:#8A6A45; --primary:#F0762F; --primary-d:#D75F1C; --primary-soft:#3A2510; --on-primary:#1C120A; --star:#E8A33D; --a:#F0762F; --b:#FFC069; }
html[data-theme="frost"]{ --bg:#081418; --bg2:#0C1B20; --surface:#0F2027; --surface2:#122731; --border:#1B3540; --text:#E4F6FA; --muted:#7FB6C4; --faint:#4C7C8B; --primary:#22C3EE; --primary-d:#0FA6CC; --primary-soft:#123640; --on-primary:#06181C; --star:#E7B23A; --a:#22C3EE; --b:#7FE0E0; }
html[data-theme="violet"]{ --bg:#150A1F; --bg2:#1C0E29; --surface:#1F1030; --surface2:#26143A; --border:#33195080; --text:#F1E6FB; --muted:#B49BC6; --faint:#7A6490; --primary:#B25CF0; --primary-d:#9A46E0; --primary-soft:#2E1745; --on-primary:#150A1F; --star:#E6A93D; --a:#B25CF0; --b:#E38CE6; }
html[data-theme="mono"]{ --bg:#0C0C0D; --bg2:#131314; --surface:#18181A; --surface2:#1E1E21; --border:#2A2A2E; --text:#F4F4F5; --muted:#A0A0A8; --faint:#65656C; --primary:#E5E5EA; --primary-d:#FFFFFF; --primary-soft:#232326; --on-primary:#0C0C0D; --star:#C8C8CE; --a:#8A8A92; --b:#E5E5EA; }
html[data-theme="sakura"]{ --bg:#1E0E15; --bg2:#26121B; --surface:#2A1520; --surface2:#331827; --border:#3F1E30; --text:#FDEAF1; --muted:#D79BB1; --faint:#93576C; --primary:#F0699C; --primary-d:#E8558B; --primary-soft:#3A1B2C; --on-primary:#1E0E15; --star:#E8A33D; --a:#F0699C; --b:#FFB0C9; }
html[data-theme="emerald"]{ --bg:#071912; --bg2:#0B2318; --surface:#0E2A1D; --surface2:#123424; --border:#1B4530; --text:#E3FAEE; --muted:#7FC7A5; --faint:#3F7C60; --primary:#16C381; --primary-d:#0C8F5B; --primary-soft:#123F2B; --on-primary:#04140D; --star:#E0A93B; --a:#16C381; --b:#57D9A6; }
html[data-theme="russia"]{ --bg:#0A0E17; --bg2:#0E1420; --surface:#121A29; --surface2:#172033; --border:#22304A; --text:#F5F7FB; --muted:#9FB0CC; --faint:#5E6E8E; --primary:#2159C7; --primary-d:#173F94; --primary-soft:#1A2C4D; --on-primary:#FFFFFF; --star:#E7C23A; --a:#D52B3E; --b:#2159C7; }

*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}
#bgVideoLayer{position:fixed; inset:0; z-index:-2; overflow:hidden; background:var(--bg);}
#bgVideoLayer video,#bgVideoLayer img{width:100%; height:100%; object-fit:cover; filter:saturate(1.05);}
#bgDim{position:fixed; inset:0; z-index:-1; background:var(--bg); opacity:.72;}
#bgEffect{position:fixed; inset:0; z-index:-1; pointer-events:none;}
.track-player{display:flex; align-items:center; gap:10px; max-width:340px; margin:16px auto 0; padding:8px 12px; border-radius:14px;}
.track-player button{width:34px; height:34px; border-radius:50%; border:none; background:var(--primary); color:var(--on-primary); font-size:13px; flex:none; display:flex; align-items:center; justify-content:center;}
.track-player .tp-name{flex:1; min-width:0; font-size:12.5px; font-weight:600; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.track-player input[type=range]{width:70px; flex:none; accent-color:var(--primary);}
body{background:var(--bg); color:var(--text); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;}
h1,h2,h3,.brand{font-family:'Manrope',sans-serif;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
img{max-width:100%; display:block;}
.wrap{max-width:760px; margin:0 auto; padding:0 20px;}

.glass{
  background:color-mix(in srgb, var(--surface) 58%, transparent);
  backdrop-filter:blur(22px) saturate(160%); -webkit-backdrop-filter:blur(22px) saturate(160%);
  border:1px solid color-mix(in srgb, var(--surface) 40%, white 18%);
  box-shadow:inset 0 1px 0 color-mix(in srgb, white 12%, transparent), var(--shadow);
}
.card{border-radius:var(--radius-md);}

.topbar{padding:16px 0;}
.brand{display:flex; align-items:center; gap:9px; font-weight:800; font-size:17px; white-space:nowrap;}
.brand .mark{width:30px; height:30px; border-radius:9px; flex:none; background:conic-gradient(from 210deg, var(--a), var(--b), var(--a)); position:relative;}
.brand .mark::after{content:""; position:absolute; inset:7px; border-radius:5px; background:var(--surface);}

.btn{font-weight:600; font-size:13.5px; border-radius:12px; padding:9px 15px; border:1px solid transparent; display:inline-flex; align-items:center; gap:6px; white-space:nowrap;}
.btn-primary{background:var(--primary); color:var(--on-primary);}
.btn-ghost{background:var(--surface2); color:var(--text); border-color:var(--border);}
.btn-sm{padding:6px 11px; font-size:12px; border-radius:9px;}

.vip-frame{position:relative;}
.vip-frame::before{content:""; position:absolute; inset:0; padding:2px; border-radius:inherit; background:linear-gradient(135deg, var(--v1), var(--v2)); -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; z-index:2;}
.avatar-wrap{position:relative; width:max-content; margin:0 auto;}
.avatar-wrap.has-crown{margin-top:30px;}
.vip-crown{position:absolute; left:50%; top:0; transform:translate(-50%,-74%); width:52px; height:52px; pointer-events:none; z-index:3; display:flex; align-items:center; justify-content:center; filter:drop-shadow(0 2px 6px rgba(0,0,0,.55));}
.vip-crown img{width:100%; height:100%; object-fit:contain;}
.vip-crown .emoji{font-size:36px; line-height:1;}
.user-badge.vip-badge{background:linear-gradient(120deg, rgba(192,132,252,.25), rgba(244,114,182,.25)); color:#e9c8ff; border-color:rgba(192,132,252,.5);}
.tool-icon{overflow:hidden;}
.tool-icon img{width:100%; height:100%; object-fit:cover;}
.profile-hero{padding:32px 24px; text-align:center; margin-bottom:20px;}
.profile-avatar{width:96px; height:96px; border-radius:50%; margin:0 auto 16px; overflow:hidden; background:var(--primary-soft); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:32px; color:var(--primary);}
.profile-avatar img{width:100%; height:100%; object-fit:cover;}
.profile-name{font-size:22px; font-weight:800;}
.role-badge{display:inline-block; font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; margin-left:8px; vertical-align:middle;}
/* ===== Роли: свои цвета, форма (слабо скруглённый квадрат), цвет ника и эффекты ===== */
/* Цвет роли = цвет ника: --rc (основной) и --rc2 (светлее, для градиента) */
.role-monkey,[data-role="monkey"]{--rc:#f472b6; --rc2:#fbcfe8;}
.role-helper,[data-role="helper"]{--rc:#4ade80; --rc2:#bbf7d0;}
.role-moder,[data-role="moder"]{--rc:#22c55e; --rc2:#86efac;}
.role-app,[data-role="app"]{--rc:#8B00FF; --rc2:#D199FF;}
.role-gmoder,[data-role="gmoder"]{--rc:#8B00FF; --rc2:#D199FF;}
.role-howner,[data-role="howner"]{--rc:#60a5fa; --rc2:#bfdbfe;}
.role-owner,[data-role="owner"]{--rc:#ef4444; --rc2:#fca5a5;}
html[data-theme="day"] .role-monkey,html[data-theme="day"] [data-role="monkey"]{--rc:#db2777; --rc2:#f472b6;}
html[data-theme="day"] .role-helper,html[data-theme="day"] [data-role="helper"]{--rc:#15803d; --rc2:#22c55e;}
html[data-theme="day"] .role-moder,html[data-theme="day"] [data-role="moder"]{--rc:#166534; --rc2:#16a34a;}
html[data-theme="day"] .role-app,html[data-theme="day"] [data-role="app"]{--rc:#a16207; --rc2:#ca8a04;}
html[data-theme="day"] .role-gmoder,html[data-theme="day"] [data-role="gmoder"]{--rc:#a16207; --rc2:#ca8a04;}
html[data-theme="day"] .role-howner,html[data-theme="day"] [data-role="howner"]{--rc:#1d4ed8; --rc2:#3b82f6;}
html[data-theme="day"] .role-owner,html[data-theme="day"] [data-role="owner"]{--rc:#dc2626; --rc2:#ef4444;}
html[data-theme="day"] .role-name{filter:none;}
html[data-theme="day"] .role-badge{--rt-target:#fff;}
.role-badge{--rt-target:#0b0b10; border-radius:5px; font-weight:700; color:color-mix(in srgb, var(--rc, var(--muted)), var(--rt-target) max(0%, calc((var(--rb, 15%) - 40%) * 1.67))); background:color-mix(in srgb, var(--rc, var(--muted)) var(--rb, 15%), transparent); border:1px solid color-mix(in srgb, var(--rc, var(--muted)) 42%, transparent);}
.role-badge.role-app,.role-badge.role-gmoder{font-size:9.5px; font-weight:600; padding:1px 7px; opacity:.85;}
.role-name{color:var(--rc, inherit);}
.role-name.fx-glow{text-shadow:0 0 14px var(--rc, var(--primary)), 0 0 2px color-mix(in srgb, var(--rc, var(--primary)) 55%, transparent);}
.role-name.fx-gradient{background:linear-gradient(120deg, var(--rc, var(--a)), var(--rc2, var(--b)), var(--rc, var(--a))); background-size:200% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; -webkit-text-fill-color:transparent; animation:nameShift var(--fx-dur, 5s) linear infinite;}
.role-name.fx-gradient.anim-off{animation:none;}
.role-name.fx-shuffle{font-variant-numeric:tabular-nums;}
@keyframes nameShift{to{background-position:200% 0;}}
@media (prefers-reduced-motion:reduce){ .role-name.fx-gradient{animation:none;} }

/* Авто-бейджи (не роли персонала — отдельная категория) */
.role-stack{display:inline-flex; flex-wrap:wrap; gap:4px; align-items:center;}
.role-stack.roles-col{display:flex; flex-direction:column; align-items:center; gap:4px;}
.role-stack .role-badge{margin-left:0;}
.profile-namerow{display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px 10px;}
.profile-namerow.col{flex-direction:column; gap:6px;}
.user-badges{display:flex; justify-content:center; gap:6px; flex-wrap:wrap; margin-top:10px;}
.user-badge{font-size:11.5px; font-weight:600; padding:4px 11px; border-radius:999px; background:var(--primary-soft); color:var(--primary); border:1px solid color-mix(in srgb, var(--primary) 30%, transparent);}
.profile-handle{font-size:13px; color:var(--muted); margin-top:2px;}
.profile-bio{font-size:14px; color:var(--muted); line-height:1.6; margin-top:12px; max-width:480px; margin-left:auto; margin-right:auto;}
.profile-loc{font-size:12.5px; color:var(--faint); margin-top:8px;}
.profile-links{display:flex; justify-content:center; gap:8px; margin-top:16px; flex-wrap:wrap;}
.profile-links a{width:38px; height:38px; border-radius:50%; background:var(--surface2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:16px;}
.profile-stats{display:flex; justify-content:center; gap:28px; margin-top:18px;}
.profile-stat b{display:block; font-size:18px;}
.profile-stat span{font-size:11.5px; color:var(--faint);}

.section-title{font-size:15px; font-weight:700; margin:24px 0 12px;}
.tool-icon{width:40px; height:40px; border-radius:12px; flex:none; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px;}
.app-row{display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:var(--radius-md); margin-bottom:8px;}
.app-meta{flex:1; min-width:0;}
.app-name{font-weight:700; font-size:14px;}
.app-desc{font-size:12.5px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.app-rating{font-size:12px; font-weight:700; color:var(--star); white-space:nowrap;}

.empty-state{padding:40px 20px; text-align:center; color:var(--faint); font-size:13.5px;}
.loading-state{padding:60px 20px; text-align:center; color:var(--faint);}

/* ---- VIP-фон «металл» ---- */
#goldBg{position:absolute; inset:0; overflow:hidden;}
#goldBg .g-base{position:absolute; inset:0; background-size:100% 100%, 100% 100%, 320% 320%; animation:goldShift 18s ease-in-out infinite;}
#goldBg .g-sheen{position:absolute; inset:-30%; background:linear-gradient(115deg, transparent 42%, rgba(255,255,255,.22) 50%, transparent 58%); animation:goldSheen 9s ease-in-out infinite;}
@keyframes goldShift{0%,100%{background-position:0 0,0 0,0% 50%;} 50%{background-position:0 0,0 0,100% 50%;}}
@keyframes goldSheen{0%{transform:translateX(-45%);} 55%,100%{transform:translateX(45%);}}
@media (prefers-reduced-motion:reduce){ #goldBg .g-base,#goldBg .g-sheen{animation:none;} }
/* ---- Знаки администрации ---- */
.staff-mark{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:6px; font-size:12px; line-height:1; vertical-align:middle; margin-left:6px; color:#fff; background:linear-gradient(135deg,var(--s1,#ef4444),var(--s2,#fbbf24)); box-shadow:0 0 8px color-mix(in srgb, var(--s1,#ef4444) 60%, transparent); cursor:help;}
.staff-owner{--s1:#ef4444; --s2:#fbbf24;}
.staff-howner{--s1:#3b82f6; --s2:#22d3ee;}
.staff-frame{position:relative;}
.staff-frame::before{content:""; position:absolute; inset:0; padding:2px; border-radius:inherit; background:linear-gradient(120deg,var(--s1),var(--s2),var(--s1)); background-size:250% 100%; animation:nameShift 6s linear infinite; -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; z-index:2;}
.staff-frame.staff-owner{box-shadow:0 0 28px -6px rgba(239,68,68,.55);}
.staff-frame.staff-howner{box-shadow:0 0 28px -6px rgba(59,130,246,.55);}
.user-badge.staff-badge{color:#fff; background:linear-gradient(135deg,var(--s1),var(--s2)); border-color:transparent;}
@media (prefers-reduced-motion:reduce){ .staff-frame::before{animation:none;} }
.admin-bar{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin-top:14px;}
.admin-bar a,.admin-bar button{font:inherit; font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:999px; border:1px solid var(--border); background:var(--surface2); color:var(--text); cursor:pointer; text-decoration:none;}
.admin-bar a:hover,.admin-bar button:hover{border-color:var(--primary); color:var(--primary);}

/* ---- галочка, статус, кольцо ---- */
.vf-check{display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:50%; background:#3b82f6; color:#fff; font-size:11px; font-weight:800; line-height:1; margin-left:6px; vertical-align:middle; cursor:help; box-shadow:0 0 6px rgba(59,130,246,.55);}
.profile-status{font-size:13.5px; color:var(--muted); font-style:italic; margin-top:6px; word-break:break-word;}
.profile-avatar.vip-ring{position:relative;}
.profile-avatar.vip-ring::after{content:""; position:absolute; inset:0; padding:3px; border-radius:inherit; background:linear-gradient(135deg, var(--v1), var(--v2)); -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; z-index:2;}

/* ---- значки-картинки с запасным глифом ---- */
.ico-wrap{display:inline-flex; align-items:center; justify-content:center; line-height:1;}
.ico-wrap .ico-img{display:none; width:100%; height:100%; object-fit:contain;}
.ico-wrap.has-img .ico-img{display:block;}
.ico-wrap.has-img .glyph{display:none;}
.vf-check .ico-wrap, .staff-mark .ico-wrap{width:100%; height:100%;}
.vf-check:has(.has-img), .staff-mark:has(.has-img){background:transparent !important; box-shadow:none !important;}
.user-badge .ico-wrap{min-width:14px; height:14px; margin-right:4px; vertical-align:-2px;}
.user-badge .ico-wrap.has-img{width:14px;}
.role-badge .ico-wrap{display:none;}
.role-badge .ico-wrap.has-img{display:inline-flex; width:12px; height:12px; margin-right:4px; vertical-align:-2px;}
.tool-icon .gen-ico, .gen-ico{width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:1.05em; border-radius:inherit; text-shadow:0 1px 2px rgba(0,0,0,.35);}
/* ---- анимированный градиентный фон ---- */
#gradBg{position:absolute; inset:0; overflow:hidden;}
#gradBg .gr-base{position:absolute; inset:0; background-size:320% 320%; animation:gradMove var(--gd,16s) ease-in-out infinite;}
#gradBg .gr-blob{position:absolute; width:60vmax; height:60vmax; border-radius:50%; filter:blur(50px); opacity:.5; animation:gradFloat calc(var(--gd,16s) * 1.2) ease-in-out infinite alternate;}
#gradBg .gr-blob.b2{animation-direction:alternate-reverse;}
@keyframes gradMove{0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;}}
@keyframes gradFloat{from{transform:translate(-8%,-6%) scale(1);} to{transform:translate(18%,14%) scale(1.15);}}
@media (prefers-reduced-motion:reduce){ #gradBg .gr-base,#gradBg .gr-blob{animation:none;} }
.bg-opt .thumb.grad{background:linear-gradient(135deg,#6d5df6,#ff7cc8); opacity:1;}
</style>
</head>
<body>
<div id="bgVideoLayer"></div>
<div id="bgDim"></div>
<canvas id="bgEffect"></canvas>
<audio id="ownerAudio" loop></audio>
<div class="wrap">
  <div class="topbar">
    <a class="brand" href="index.html">
      <div class="mark"></div>
      <span>DevHub</span>
    </a>
  </div>

  <div id="content">
    <div class="loading-state">Загружаем профиль…</div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://nnuauvwjeiewituexgsj.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_H993QAi7e7uhkL_UfF-uRA_cDIHdcoM';
let sbClient = null;
try{
  if(window.supabase && typeof window.supabase.createClient === 'function'){
    sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
  }
}catch(e){ console.error('Ошибка инициализации Supabase:', e); }

/* Подхватываем тему, если посетитель уже выбирал её на главном сайте */
try{
  const savedSettings = JSON.parse(localStorage.getItem('devhub_settings'));
  if(savedSettings?.theme) document.documentElement.setAttribute('data-theme', savedSettings.theme);
}catch(e){}

/* ===================== ЗНАЧКИ: свой файл у каждого значка, пока файла нет — запасной глиф ===================== */
/* Файлы кладите в бакет assets, папка icons/: verified.png, vip.png, staff-owner.png, staff-howner.png,
   badge-active.png, badge-author.png, badge-supporter.png, role-monkey.png, role-helper.png, role-moder.png,
   role-app.png, role-gmoder.png, role-howner.png, role-owner.png  (PNG/WebP с прозрачным фоном, ~64×64) */
var ICON_BASE = SUPABASE_URL + '/storage/v1/object/public/assets/icons/';
function icoHtml(file, glyph){
  return `<span class="ico-wrap"><img class="ico-img" src="${ICON_BASE}${encodeURIComponent(file)}.png" alt="" loading="lazy" onload="this.parentNode.classList.add('has-img')" onerror="this.remove()"><span class="glyph">${glyph}</span></span>`;
}
/* ---- значок приложения: своя картинка -> эмодзи из каталога -> уникальный сгенерированный значок ---- */
function genIconHtml(name){
  const s = String(name || '?').trim(); let h = 0;
  for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  const hue = h % 360, ch = escapeHtml((s.match(/[A-Za-zА-Яа-яЁё0-9]/) || ['?'])[0].toUpperCase());

/* ===================== НИК: цвет роли + эффекты профиля ===================== */
const FX_CLASSES = ['fx-glow','fx-gradient','fx-shuffle'];
function runShuffle(el, text){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const chars = 'abcdefghijklmnopqrstuvwxyzабвгдеёжзийклмнопрстуфхцчшщэюя0123456789#$%&*';
  const run = ()=>{
    let frame = 0; const total = Math.max(10, text.length * 2);
    clearInterval(el._fxTimer);
    el._fxTimer = setInterval(()=>{
      frame++;
      const settled = Math.floor(frame / total * text.length);
      el.textContent = text.split('').map((ch,i)=> (i < settled || ch === ' ') ? ch : chars[Math.floor(Math.random()*chars.length)]).join('');
      if(frame >= total){ clearInterval(el._fxTimer); el.textContent = text; }
    }, 45);
  };
  run();
  const loop = ()=>{ if(!el.isConnected) return; run(); el._fxTimeout = setTimeout(loop, 7000); };
  el._fxTimeout = setTimeout(loop, 7000);
}
/* Единая точка: цвет ника по роли + эффект из профиля (glow / gradient / shuffle).
   Используется в шапке, меню аватарки, превью и на странице профиля. */
function applyNameFx(el, fx, role, text, grad){
  if(!el) return;
  text = String(text == null ? '' : text);
  const sig = [fx||'none', role||'', text, grad ? grad.c1 + grad.c2 + (grad.anim || '') : ''].join('|');
  if(el._fxSig === sig && el.isConnected) return;
  el._fxSig = sig;
  clearInterval(el._fxTimer); clearTimeout(el._fxTimeout);
  el.classList.add('role-name');
  FX_CLASSES.forEach(c=>el.classList.remove(c));
  if(role && ROLE_LABELS[role]) el.setAttribute('data-role', role); else el.removeAttribute('data-role');
  if(grad){ el.style.setProperty('--rc', grad.c1); el.style.setProperty('--rc2', grad.c2); }
  else { el.style.removeProperty('--rc'); el.style.removeProperty('--rc2'); }
  const speeds = { slow:'10s', normal:'5s', fast:'2.2s' };
  el.classList.toggle('anim-off', !!(grad && grad.anim === 'off'));
  if(grad && speeds[grad.anim]) el.style.setProperty('--fx-dur', speeds[grad.anim]); else el.style.removeProperty('--fx-dur');
  el.textContent = text;
  if(fx === 'glow') el.classList.add('fx-glow');
  else if(fx === 'gradient') el.classList.add('fx-gradient');
  else if(fx === 'shuffle'){ el.classList.add('fx-shuffle'); runShuffle(el, text); }
  if(grad) el.classList.add('fx-gradient');
}

function linkHost(h){ return String(h || '').toLowerCase().replace(/^(www|m)\./, ''); }
/* Вход: тип сервиса + то, что ввёл человек (ник или полный адрес). Выход: { href, label } | { copy, label } | null.
   Допускаются только http(s) и mailto — javascript:, data: и прочее отбрасываются. */
function normalizeLink(type, raw){
  const svc = LINK_SERVICES[type] || LINK_SERVICES.site;
  const t = LINK_SERVICES[type] ? type : 'site';
  let v = String(raw == null ? '' : raw).trim();
  if(!v || v.length > 300) return null;
  if(svc.mail){
    v = v.replace(/^mailto:/i, '');
    return /^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/.test(v) ? { href:'mailto:' + v, label:v } : null;
  }
  const scheme = v.match(/^([a-z][a-z0-9+.-]*):/i);
  if(scheme && !/^https?$/i.test(scheme[1])) return null;
  const hasScheme = /^https?:\/\//i.test(v) || v.startsWith('//');
  const startsHost = (svc.hosts || []).some(h => new RegExp('^(www\\.|m\\.)?' + h.replace(/\./g, '\\.') + '([/?#]|$)', 'i').test(v));
  if(t === 'site' || hasScheme || startsHost){
    let u;
    try{ u = new URL(hasScheme ? (v.startsWith('//') ? 'https:' + v : v) : 'https://' + v); }catch(e){ return null; }
    if(!/^https?:$/.test(u.protocol) || !u.hostname.includes('.')) return null;
    if(t !== 'site' && svc.hosts){
      const h = linkHost(u.hostname);
      if(!svc.hosts.some(x => h === x || h.endsWith('.' + x))) return null;
    }
    return { href:u.href, label: linkHost(u.hostname) + (u.pathname !== '/' ? u.pathname : '') };
  }
  const name = v.replace(/^@/, '').replace(/\/+$/, '');
  if(svc.copy) return name && name.length <= 64 ? { href:null, copy:name, label:name } : null;
  if(!/^[A-Za-z0-9._-]{1,64}$/.test(name)) return null;
  return { href: svc.base + name, label: (t === 'tiktok' || t === 'youtube' ? '@' : '') + name };
}

}

/* ===================== ВНЕШНИЙ ВИД ВЛАДЕЛЬЦА ПРОФИЛЯ ===================== */
let fxAnim = null;
function startBgEffect(type){
  const canvas = document.getElementById('bgEffect');
  const ctx = canvas.getContext('2d');
  cancelAnimationFrame(fxAnim);
  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  resize(); window.onresize = resize;
  if(!type || type==='none'){ ctx.clearRect(0,0,canvas.width,canvas.height); return; }
  const particles = [];
  const count = type==='stars'?140:type==='snow'?90:type==='rain'?110:60;
  for(let i=0;i<count;i++){
    particles.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:Math.random()*2+0.5, v:Math.random()*1.4+0.4, o:Math.random()*0.6+0.2});
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(type==='grid'){
      ctx.strokeStyle='rgba(150,150,255,0.15)'; ctx.lineWidth=1;
      const g=40;
      for(let x=0;x<canvas.width;x+=g){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
      for(let y=0;y<canvas.height;y+=g){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }
    } else if(type==='aurora'){
      const t=Date.now()/2000;
      const grad = ctx.createLinearGradient(0,0,canvas.width,canvas.height);
      grad.addColorStop(0,'rgba(139,124,255,0.10)'); grad.addColorStop(.5+Math.sin(t)*0.2,'rgba(34,195,238,0.10)'); grad.addColorStop(1,'rgba(178,92,240,0.10)');
      ctx.fillStyle=grad; ctx.fillRect(0,0,canvas.width,canvas.height);
    } else {
      particles.forEach(p=>{
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${p.o})`;
        if(type==='rain'){ ctx.fillRect(p.x,p.y,1,10); p.y += p.v*6; }
        else { ctx.arc(p.x,p.y,p.s,0,7); ctx.fill(); p.y += p.v; }
        if(p.y>canvas.height){ p.y=-10; p.x=Math.random()*canvas.width; }
      });
    }
    fxAnim = requestAnimationFrame(draw);
  }
  draw();
}

  const av = document.querySelector('.profile-avatar');
  if(av){
    av.style.borderRadius = ({circle:'50%', rounded:'20px', square:'6px'})[c.avatarShape] || '50%';
    av.style.boxShadow = c.ring ? '0 0 0 3px var(--primary)' : 'none';
    if(vip && c.vipRing && HEX_RE.test(c.vipC1 || '') && HEX_RE.test(c.vipC2 || '')){
      av.classList.add('vip-ring'); av.style.setProperty('--v1', c.vipC1); av.style.setProperty('--v2', c.vipC2);
    }
  }
  if(profile.theme && THEME_IDS.includes(profile.theme)){
    document.documentElement.setAttribute('data-theme', profile.theme);
  }
  applyOwnerBackground(profile, c);
  startBgEffect(c.bgFx || 'none');
  setupOwnerPlayer(profile, c);
}

async function renderProfile(userId){
  if(!sbClient){
    document.getElementById('content').innerHTML = '<div class="loading-state">Сервис недоступен, попробуйте позже.</div>';
    return;
  }

  const BASE_FIELDS = 'id, display_name, handle, bio, location, avatar_url, links, stat_downloads, stat_suggestions, role';
  const FULL_FIELDS = BASE_FIELDS + ', bg_url, bg_type, track_url, track_name, customization, theme, bg_preset, track_preset, badges, depts, vip';
  // от полного набора к базовому: колонки verified/crown_url (миграция 9) и vip (миграция 6) могут ещё отсутствовать во view
  const fieldSets = [FULL_FIELDS + ', verified, crown_url', FULL_FIELDS, FULL_FIELDS.replace(', vip', ''), BASE_FIELDS];
  let profile = null, profileError = null;
  for(const fields of fieldSets){
    ({ data: profile, error: profileError } = await sbClient.from('public_profiles').select(fields).eq('id', userId).maybeSingle());
    if(!profileError) break;
    console.warn('select не прошёл, пробуем набор поменьше:', profileError.message);
  }

  if(profileError || !profile || !profile.display_name){
    renderNotFound();
    return;
  }

  const fetchApps = cols => sbClient.from('apps').select(cols).eq('added_by', userId).eq('status', 'approved').order('created_at', { ascending: false });
  let appsRes = await fetchApps('id, name, description, icon, icon_url, rating');
  if(appsRes.error) appsRes = await fetchApps('id, name, description, icon, rating'); // миграция 6 ещё не применена
  const apps = appsRes.data;

  const avatarHtml = profile.avatar_url
    ? `<img src="${profile.avatar_url}" alt="">`
    : (profile.display_name || '?')[0].toUpperCase();

  const ownerVipLinks = !!profile.vip || isStaffRole(profile.role);
  const linksHtml = linkAnchorsHtml(profile.links, ownerVipLinks ? 12 : 6);

  const pc = profile.customization || {};
  const rolesLayout = pc.rolesLayout === 'row' ? 'row' : 'column';   // по умолчанию — столбиком
  const rolesHtml = roleBadgesHtml(profile.role, profile.depts, pc.primaryRole);
  const roleBg = Number.isFinite(pc.roleBgOpacity) ? pc.roleBgOpacity : 15;
  const staffBadge = isStaffRole(profile.role) ? `<span class="user-badge staff-badge staff-${profile.role}">${icoHtml('staff-' + profile.role, '🛡')}${profile.role === 'owner' ? 'Владелец проекта' : 'Администрация'}</span>` : '';
  const vipBadge = staffBadge + (profile.vip ? `<span class="user-badge vip-badge">${icoHtml('vip','💎')}VIP</span>` : '');
  const badgesHtml = vipBadge + (Array.isArray(profile.badges) ? profile.badges : [])
    .filter(b=>BADGE_DEFS[b]).map(b=>`<span class="user-badge">${icoHtml('badge-' + b, BADGE_DEFS[b][0])}${BADGE_DEFS[b][1]}</span>`).join('');

  const appsHtml = (apps && apps.length)
    ? apps.map(appRowHTML).join('')
    : '<div class="empty-state">Пока нет опубликованных приложений</div>';

  document.getElementById('content').innerHTML = `
    <div class="profile-hero card glass">
      <div class="avatar-wrap" id="profAvatarWrap"><div class="vip-crown" id="profCrown" style="display:none;"></div><div class="profile-avatar">${avatarHtml}</div></div>
      <div class="profile-namerow ${rolesLayout === 'column' ? 'col' : ''}">
        <span class="profile-name" id="profNick"></span>${profile.verified ? `<span class="vf-check" title="Подтверждённый аккаунт">${icoHtml('verified','✔')}</span>` : ''}${isStaffRole(profile.role) ? `<span class="staff-mark staff-${profile.role}" title="${STAFF_TITLES[profile.role]}">${icoHtml('staff-' + profile.role, '🛡')}</span>` : ''}
        ${rolesHtml ? `<span class="role-stack ${rolesLayout === 'column' ? 'roles-col' : 'roles-row'}" style="--rb:${roleBg}%;">${rolesHtml}</span>` : ''}
      </div>
      ${profile.handle ? `<div class="profile-handle">@${escapeHtml(profile.handle)}</div>` : ''}
      ${(ownerVipLinks && typeof pc.vipStatus === 'string' && pc.vipStatus.trim()) ? `<div class="profile-status">${escapeHtml(pc.vipStatus.trim().slice(0, 60))}</div>` : ''}
      ${profile.bio ? `<div class="profile-bio">${escapeHtml(profile.bio)}</div>` : ''}
      ${profile.location ? `<div class="profile-loc">📍 ${escapeHtml(profile.location)}</div>` : ''}
      ${badgesHtml ? `<div class="user-badges">${badgesHtml}</div>` : ''}
      ${linksHtml ? `<div class="profile-links">${linksHtml}</div>` : ''}
      <div id="trackPlayerHolder"></div>
      <div class="admin-bar" id="adminBar" style="display:none;"></div>
      <div class="profile-stats">
        <div class="profile-stat"><b>${profile.stat_downloads || 0}</b><span>скачиваний</span></div>
        <div class="profile-stat"><b>${profile.stat_suggestions || 0}</b><span>предложений</span></div>
        <div class="profile-stat"><b>${apps ? apps.length : 0}</b><span>приложений</span></div>
      </div>
    </div>
    <div class="section-title">Приложения на DevHub</div>
    ${appsHtml}
  `;
  applyOwnerLook(profile);
  bindLinkCopy(document.querySelector('.profile-links'), a=>{ const old = a.textContent; a.textContent = '✓'; setTimeout(()=>{ a.textContent = old; }, 1200); });
  showAdminBar(userId);
}

/* Кнопки для администрации: видны только если зашедший — Генерал или Помощник генерала.
   Реальные права всё равно проверяет воркер, это только удобство. */
async function showAdminBar(targetId){
  if(!sbClient) return;
  try{
    const { data: { session } } = await sbClient.auth.getSession();
    if(!session) return;
    const { data: me } = await sbClient.from('profiles').select('role').eq('id', session.user.id).maybeSingle();
    if(!me || !isStaffRole(me.role)) return;
    const bar = document.getElementById('adminBar');
    if(!bar) return;
    const own = session.user.id === targetId;
    bar.innerHTML = (own ? '' : `<a href="index.html?manage=${encodeURIComponent(targetId)}">🛡 Управлять</a>`) + '<button type="button" id="admCopyUuid">Копировать UUID</button>';
    bar.style.display = '';
    document.getElementById('admCopyUuid').addEventListener('click', async e=>{
      try{ await navigator.clipboard.writeText(targetId); e.target.textContent = 'Скопировано ✓'; }catch(err){ e.target.textContent = targetId; }
    });
  }catch(e){ console.warn('admin bar failed:', e); }
}

const params = new URLSearchParams(window.location.search);
const userId = params.get('id');
if(userId){
  renderProfile(userId);
} else {
  renderNotFound();
}

var I18N_ON = false, i18nObs = null;
function i18nStored(){ try{ return localStorage.getItem('devhub_lang') === 'en' ? 'en' : 'ru'; }catch(e){ return 'ru'; } }
function trText(s){
  const key = String(s).replace(/\s+/g, ' ').trim();
  if(!key) return null;
  let out = I18N_EN[key];
  if(out === undefined){
    for(const [re, rep] of I18N_RX){ if(re.test(key)){ out = key.replace(re, rep); break; } }
  }
  if(out === undefined) return null;
  return String(s).match(/^\s*/)[0] + out + String(s).match(/\s*$/)[0];
}

function tr(s){ if(!I18N_ON) return s; const r = trText(s); return r === null ? s : r; }

function i18nAttrs(el){

    else if(cur !== store[a] && cur !== store[a + ':en']){ if(I18N_CYR.test(cur)) store[a] = cur; else { delete store[a]; delete store[a + ':en']; continue; } }

function i18nApply(root){

function i18nWatch(){
